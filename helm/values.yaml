ezua:
  virtualService:
    endpoint: "defence-ops.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
  # SSO at the ingress through oauth2-proxy. The policy lives in istio-system, so the Tilt dev loop
  # turns it off.
  authorizationPolicy:
    enabled: true

global:
  # development runs Next.js and uvicorn with live reload; production runs the built app.
  appEnv: production
  # Extra environment variables for every container, as a list of Kubernetes EnvVar objects.
  extraEnv: []
  image:
    tag: "1.2.0"
    pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: ""

# Models come from the in-cluster LiteLLM proxy with the app's own virtual key, kept in a Secret
# created outside the release: kubectl create secret generic defence-ops-litellm
# --from-file=api-key=<key file>. Model capabilities (vision, video, reasoning) come from LiteLLM's
# model_info for each model.
llm:
  baseUrl: http://litellm.litellm.svc.cluster.local:4000
  apiKeySecret:
    name: defence-ops-litellm
    key: api-key
  # Frames sent to a model that takes images but not video
  maxImages: 5

# Broker and topic are set on System Config; the credentials are a Secret created outside the
# release, with keys username and password, for a user limited to the alerts stream.
kafka:
  credentialsSecret:
    name: defence-ops-kafka
  securityProtocol: SASL_PLAINTEXT
  saslMechanism: PLAIN

# Who may change System Config. oidc verifies the Keycloak ID token oauth2-proxy forwards and
# needs adminRole among the user's realm roles; open lets anyone, for the Tilt dev loop only.
settings:
  auth: oidc
  adminRole: admin
  oidc:
    issuer: "https://keycloak.${DOMAIN_NAME}/realms/UA"
    audience: ua

# Only the Istio ingress gateway may reach the pod, so nothing in the cluster can go round SSO.
networkPolicy:
  enabled: true
  ingressGateway:
    namespace: istio-system
    podLabels:
      istio: ingressgateway

securityContext:
  # The Tilt dev loop turns this off so that it can sync files into the containers.
  readOnlyRootFilesystem: true

# Holds config.json, which the settings page writes and the services read. The claim keeps the name
# app-data so that upgrades from chart 0.0.x keep the saved settings.
persistence:
  claimName: app-data
  size: 100Mi

# All four services share one pod, so each listens on its own port. Resource requests are calculated
# from peak use measured on lonpcai on 2026-11-02. Under the UI's frame and video-context calls for
# every video, then three all-video requests at once: kafka-service 68 MiB, llm-service 124 MiB,
# video-service 449 MiB and about 2 CPU cores. app-ui (built, `next start`) peaked at 257 MiB in the
# 1.0.1 release. Limits leave headroom above that.
appUi:
  image: erdincka/defence-ops-app-ui
  port: 3000
  probePath: /
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: "2"
      memory: 2Gi

kafkaService:
  image: erdincka/defence-ops-kafka-service
  port: 8001
  probePath: /health
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

llmService:
  image: erdincka/defence-ops-llm-service
  port: 8002
  probePath: /health
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: "1"
      memory: 1Gi

videoService:
  image: erdincka/defence-ops-video-service
  port: 8003
  probePath: /health
  # Custom uploads live on a scratch volume until the pod restarts
  maxUploadMB: 200
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "4"
      memory: 4Gi
